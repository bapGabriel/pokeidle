<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéIdle</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Tiny5&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        @theme {
        --font-tiny: "Tiny5", sans-serif;
        }

        @layer utilities {
            .font-tiny {
                font-family: var(--font-tiny);
            }
        }
    </style>
    <style>
        @keyframes pulse-red {
            0% {
                filter: brightness(100%);
            }

            50% {
                filter: brightness(150%) hue-rotate(-20deg) drop-shadow(0 0 5px red);
            }

            100% {
                filter: brightness(100%);
            }
        }

        .damage-pulse {
            animation: pulse-red 0.05s ease-out 1;
        }

        .mask-radial {
            mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 0%);
            -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 50%, rgba(0, 0, 0, 0) 0%);
        }
    </style>
</head>

<body class="bg-green-400 font-tiny">
    <div id="root" class="flex items-center justify-center h-auto">
        <!-- CONTAINER -->
        <div class="flex flex-1 h-screen gap-2 p-2 mx-auto">
            <!-- INIMIGO/FASE -->
            <div class="flex flex-col flex-1 bg-gray-200 rounded-lg border-3 border-slate-500">
                <!-- SELETOR DE FASE -->
                <div class="flex mt-2">
                    <div class="w-2"></div>

                    <div
                        class="flex flex-col items-center flex-1 overflow-hidden border-r-0 rounded-lg rounded-r-none bg-slate-400 border-3 border-slate-500">
                        <div class="flex gap-2 p-2 pb-4 overflow-x-scroll">
                            <div class="flex-none">
                                <img src="" class="w-24 h-24">
                            </div>
                        </div>
                        <div class="flex w-full gap-12 p-2 bg-slate-200">
                            <div>
                                <span id="stage-name" class="capitalize">Lugar</span>
                                <span id="stage-level" class="text-black/35">Lv. ?</span>
                            </div>

                            <div class="flex items-center flex-1 gap-2">
                                <div class="w-full h-3 border-2 bg-slate-700 border-neutral-700">
                                    <div id="stage-threat-bar" class="h-2 bg-yellow-400" style="width: 0%;"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- POKÉMON INIMIGO -->
                <div class="flex flex-col items-center justify-between flex-1 h-auto gap-2">
                    <div id="enemy-container" class="flex flex-col items-center justify-center flex-1 w-full">
                        <!-- SPRITE -->
                        <img id="pokemon-enemy-image" class="absolute z-1 h-1/2 [image-rendering:pixelated]">
                        

                        <div
                            class="absolute z-0 flex items-center justify-center w-64 h-64 scale-x-100 scale-y-100 translate-y-20 bg-gray-400 mask-radial sm:scale-x-150 md:scale-x-200 lg:scale-x-250 xl:scale-x-300">
                            <div
                                class="absolute z-0 flex items-center justify-center bg-gray-300 h-60 w-60 mask-radial">
                                <div
                                    class="absolute z-0 flex items-center justify-center w-48 h-48 bg-gray-200 mask-radial">
                                </div>
                            </div>
                        </div>

                        <div class="flex flex-col flex-1 w-full gap-1 py-4">
                            <div class="flex-[3] w-full bg-gray-400"></div>
                            <div class="flex-[3] w-full bg-gray-400"></div>
                            <div class="flex-[3] w-full bg-gray-400"></div>
                            <div class="flex-[3] w-full bg-gray-400"></div>
                            <div class="flex-[3] w-full bg-gray-400/60"></div>
                            <div class="flex-[1] w-full bg-gray-400/40"></div>
                            <div class="flex-[1] w-full bg-gray-400/40"></div>
                            <div class="flex-[24] w-full bg-gray-200"></div>
                            <div class="flex-[1] w-full bg-gray-400/20"></div>
                            <div class="flex-[3] w-full bg-gray-400/20"></div>
                            <div class="flex-[3] w-full bg-gray-400/20"></div>
                            <div class="flex-[3] w-full bg-gray-400/20"></div>
                            <div class="flex-[3] w-full bg-gray-400/20"></div>
                            <div class="flex-[3] w-full bg-gray-400/20"></div>
                            <div class="flex-[3] w-full bg-gray-400/10"></div>
                            <div class="flex-[3] w-full bg-gray-400/5"></div>
                            <div class="flex-[3] w-full bg-gray-400/4"></div>
                            <div class="flex-[3] w-full bg-gray-400/3"></div>
                            <div class="flex-[3] w-full bg-gray-400/2"></div>
                            <div class="flex-[3] w-full bg-gray-400/1"></div>
                        </div>

                        <div id="pokemon-enemy-loading" class="absolute z-50>
                                <?xml version=" 1.0" encoding="utf-8" ?>
                            <!-- Uploaded to: SVG Repo, www.svgrepo.com, Generator: SVG Repo Mixer Tools -->
                            <svg class="h-64 w-64 animate-spin" fill=" #90a1b9" viewBox="0 0 32 32"
                                xmlns="http://www.w3.org/2000/svg">
                                <path
                                    d="M 16 3 C 14.34375 3 13 4.34375 13 6 C 13 7.65625 14.34375 9 16 9 C 17.65625 9 19 7.65625 19 6 C 19 4.34375 17.65625 3 16 3 Z M 8.9375 6.4375 C 7.558594 6.4375 6.4375 7.558594 6.4375 8.9375 C 6.4375 10.316406 7.558594 11.4375 8.9375 11.4375 C 10.316406 11.4375 11.4375 10.316406 11.4375 8.9375 C 11.4375 7.558594 10.316406 6.4375 8.9375 6.4375 Z M 23.0625 7.9375 C 22.511719 7.9375 22.0625 8.386719 22.0625 8.9375 C 22.0625 9.488281 22.511719 9.9375 23.0625 9.9375 C 23.613281 9.9375 24.0625 9.488281 24.0625 8.9375 C 24.0625 8.386719 23.613281 7.9375 23.0625 7.9375 Z M 6 13.75 C 4.757813 13.75 3.75 14.757813 3.75 16 C 3.75 17.242188 4.757813 18.25 6 18.25 C 7.242188 18.25 8.25 17.242188 8.25 16 C 8.25 14.757813 7.242188 13.75 6 13.75 Z M 26 14.75 C 25.308594 14.75 24.75 15.308594 24.75 16 C 24.75 16.691406 25.308594 17.25 26 17.25 C 26.691406 17.25 27.25 16.691406 27.25 16 C 27.25 15.308594 26.691406 14.75 26 14.75 Z M 8.9375 21.0625 C 7.832031 21.0625 6.9375 21.957031 6.9375 23.0625 C 6.9375 24.167969 7.832031 25.0625 8.9375 25.0625 C 10.042969 25.0625 10.9375 24.167969 10.9375 23.0625 C 10.9375 21.957031 10.042969 21.0625 8.9375 21.0625 Z M 23.0625 21.5625 C 22.234375 21.5625 21.5625 22.234375 21.5625 23.0625 C 21.5625 23.890625 22.234375 24.5625 23.0625 24.5625 C 23.890625 24.5625 24.5625 23.890625 24.5625 23.0625 C 24.5625 22.234375 23.890625 21.5625 23.0625 21.5625 Z M 16 24.25 C 15.035156 24.25 14.25 25.035156 14.25 26 C 14.25 26.964844 15.035156 27.75 16 27.75 C 16.964844 27.75 17.75 26.964844 17.75 26 C 17.75 25.035156 16.964844 24.25 16 24.25 Z" />
                            </svg>
                        </div>
                    </div>

                    <div>
                        <span id="event-log"></span>
                    </div>

                    <!-- HP -->
                    <div class="flex flex-col items-center w-full gap-2">
                        <div class="flex w-full">
                            <div class="w-full overflow-hidden border-l-0 rounded-r-lg border-3 border-neutral-700">
                                <div class="flex items-center justify-between p-2 bg-slate-400">
                                    <div>
                                        <span id="pokemon-enemy-name" class="capitalize">Pokémon Inimigo</span>
                                        <span id="pokemon-enemy-level" class="text-black/35">Lv. ?</span>
                                    </div>

                                    <div class="overflow-hidden border-2 rounded-xl border-neutral-700">
                                        <div class="border-1 border-slate-200 rounded-xl">
                                            <p id="pokemon-enemy-type" class="px-2 text-center">Tipagem
                                            </p>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2 p-2 bg-slate-200">
                                    <span>HP:</span>
                                    <div class="w-full h-3 border-2 bg-slate-400 border-neutral-700">
                                        <div id="pokemon-enemy-health-bar" class="h-2 bg-green-400">
                                        </div>
                                    </div>
                                    <span id="pokemon-enemy-health">?/?</span>
                                </div>
                            </div>
                            <div class="w-2"></div>
                        </div>

                        <!-- AÇÕES -->
                        <div class="flex w-full gap-2 p-2">
                            <div class="w-full overflow-hidden rounded-lg border-3 border-neutral-700">
                                <button id="action-attack-enemy"
                                    class="w-full p-2 bg-red-400 border-red-700 border-b-3 hover:bg-red-400/80 hover:border-red-700/80 active:bg-red-400/60 active:border-red-700/60">Atacar</button>
                            </div>
                            <div class="w-full overflow-hidden rounded-lg border-3 border-neutral-700">
                                <button id="action-capture-enemy"
                                    class="w-full p-2 bg-emerald-400 border-b-3 border-emerald-700 hover:bg-emerald-400/80 hover:border-emerald-700/80 active:bg-emerald-400/60 active:border-emerald-700/60">Capturar</button>
                            </div>

                        </div>

                    </div>
                </div>
            </div>

            <div class="flex flex-col flex-1 gap-2">
                <!-- LOJA / UPGRADES -->
                <div
                    class="flex items-center justify-between gap-4 overflow-hidden bg-gray-200 rounded-lg border-3 border-slate-500 h-1/5">
                    <div class="flex flex-col w-1/3 h-full gap-1 p-2">
                        <div class="w-full h-full overflow-hidden rounded-lg border-3 border-neutral-700">
                            <button
                                class="w-full h-full bg-amber-400 border-b-3 border-amber-700 hover:bg-amber-400/80 hover:border-amber-700/80 active:bg-amber-400/60 active:border-amber-700/60">
                                + Ataque (Pessoal) ($100)</button>
                        </div>
                        <div class="w-full h-full overflow-hidden rounded-lg border-3 border-neutral-700">
                            <button
                                class="w-full h-full bg-amber-400 border-b-3 border-amber-700 hover:bg-amber-400/80 hover:border-amber-700/80 active:bg-amber-400/60 active:border-amber-700/60">
                                + Ataque (Pokémons) ($100)</button>
                        </div>
                        <div class="w-full h-full overflow-hidden rounded-lg border-3 border-neutral-700">
                            <button
                                class="w-full h-full bg-amber-400 border-b-3 border-amber-700 hover:bg-amber-400/80 hover:border-amber-700/80 active:bg-amber-400/60 active:border-amber-700/60">
                                + Dinheiro Obtido ($100)</button>
                        </div>
                        <div class="w-full h-full overflow-hidden rounded-lg border-3 border-neutral-700">
                            <button
                                class="w-full h-full bg-amber-400 border-b-3 border-amber-700 hover:bg-amber-400/80 hover:border-amber-700/80 active:bg-amber-400/60 active:border-amber-700/60">
                                + Taxa de Captura ($100)</button>
                        </div>

                    </div>
                    <div class="flex flex-col items-center justify-between w-2/3 h-full">
                        <div class="flex-1 w-full h-full p-2 pl-0">
                            <div class="w-full h-full overflow-hidden rounded-lg border-3 border-neutral-700">
                                <button id="pokeball-buy"
                                    class="w-full h-full p-2 bg-amber-400 border-b-3 border-amber-700 hover:bg-amber-400/80 hover:border-amber-700/80 active:bg-amber-400/60 active:border-amber-700/60">
                                    + Pokebola ($100)</button>
                            </div>
                        </div>
                        <div
                            class="flex flex-col w-full p-1 px-2 rounded-tl-lg bg-slate-400 border-t-3 border-l-3 border-slate-500">
                            <div class="flex justify-between gap-2">
                                <span>Pokebolas</span>
                                <span id="resource-pokeballs-quantity">0</span>
                            </div>
                            <div class="flex justify-between gap-2">
                                <span>Pokedolares</span>
                                <span id="resource-pokedollars-quantity">$0</span>
                            </div>
                        </div>
                    </div>

                </div>
                <!-- MEU TIME -->
                <div class="flex flex-col pb-2 bg-gray-200 rounded-lg border-3 border-slate-500 h-4/5">
                    <!-- ESTATISTICAS -->
                    <div class="flex justify-between p-4 pl-0">
                        <div class="flex w-full">
                            <div class="w-full overflow-hidden border-l-0 rounded-r-lg border-3 border-neutral-700">
                                <div class="p-2 bg-slate-400">
                                    <span class="text-gray-100">Atributos e Estatísticas</span>
                                </div>
                                <div class="grid items-center grid-cols-4 gap-2 p-2 bg-slate-200">
                                    <div>
                                        <span>DANO PESSOAL: </span><span id="stats-player-attack">0</span>
                                    </div>
                                    <div>
                                        <span>DANO DO TIME: </span><span id="stats-player-dps">0</span>
                                    </div>
                                    <div>
                                        <span>DINHEIRO OBTIDO: </span><span id="stats-player-money-multiplier">0</span>
                                    </div>
                                    <div>
                                        <span>TAXA DE CAPTURA: </span><span
                                            id="stats-player-capture-multiplier">0</span>
                                    </div>
                                </div>
                            </div>
                            <div class="w-2"></div>
                        </div>
                    </div>

                    <!-- MEUS POKEMON -->
                    <div id="player-pokemon-set" class="flex flex-col flex-1 min-h-0 gap-2 overflow-y-scroll">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/config.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/utils/visual.js"></script>
    <script src="scripts/data/pokemonCache.js"></script>
    <script src="scripts/data/pokemonTypes.js"></script>
    <script src="scripts/models/Pokemon.js"></script>
    <script src="scripts/models/PokemonAlly.js"></script>
    <script src="scripts/models/PokemonEnemy.js"></script>
    <script src="scripts/models/Resource.js"></script>
    <script src="scripts/models/Stage.js"></script>
    <script src="scripts/models/Player.js"></script>
    <script src="scripts/models/BattleManager.js"></script>
    <script src="scripts/models/Game.js"></script>
    <script src="scripts/main.js"></script>

</body>

</html>
